networks:
  app-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:

services:

  # ── Migrations Alembic (one-shot, sort en 0 quand termine) ──────────────────
  migrate:
    build:
      context: ./backend
      target: dev
    container_name: projet_action_migrate
    command: ["alembic", "upgrade", "head"]
    env_file:
      - .env
    volumes:
      - ./backend:/app
    networks:
      - app-net
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # ── API FastAPI ─────────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      target: dev
    container_name: projet_action_api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - /app/__pycache__
    networks:
      - app-net
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── PostgreSQL 16 ───────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: projet_action_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-projet_action}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
    - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-projet_action}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ── Redis 7 (cache yfinance / rate-limit) ───────────────────────────────────
  cache:
    image: redis:7-alpine
    container_name: projet_action_cache
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save 60 1
    volumes:
      - redis_data:/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ── Frontend Next.js ─────────────────────────────────────────────────────────
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: projet_action_web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
      - INTERNAL_API_URL=${INTERNAL_API_URL:-http://api:8000}
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - app-net
    depends_on:
      - db
      - cache

  # ── Adminer (inspecteur DB) ───────────────────────────────────────────────────
  adminer:
    image: adminer:latest
    container_name: projet_action_adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    networks:
      - app-net
    depends_on:
      - db

  # ── Mailpit (fake SMTP, capture des emails en dev) ──────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: projet_action_mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      MP_MAX_MESSAGES: 500
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/livez"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ── Reverse proxy nginx (single-origin pour browser) ────────────────────────
  proxy:
    image: nginx:1.27-alpine
    container_name: projet_action_proxy
    restart: unless-stopped
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app-net
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
