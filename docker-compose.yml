networks:
  app-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:

services:

  # ── API FastAPI ─────────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      target: dev
    container_name: projet_action_api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - /app/__pycache__
    networks:
      - app-net
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── PostgreSQL 16 ───────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: projet_action_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-projet_action}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis dans .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-projet_action}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ── Redis 7 (cache yfinance / rate-limit) ───────────────────────────────────
  cache:
    image: redis:7-alpine
    container_name: projet_action_cache
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save 60 1
    volumes:
      - redis_data:/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ── Frontend Next.js (stub) ─────────────────────────────────────────────────
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: projet_action_web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    env_file:
      - .env
    networks:
      - app-net
    depends_on:
      api:
        condition: service_healthy

  # ── Adminer (inspecteur DB) — profil tools ──────────────────────────────────
  adminer:
    image: adminer:latest
    container_name: projet_action_adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    networks:
      - app-net
    depends_on:
      - db
    profiles:
      - tools
