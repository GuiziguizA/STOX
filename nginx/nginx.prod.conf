worker_processes auto;
events { worker_connections 2048; }

http {
  # Pas de directive `resolver` : portable Docker + Podman/netavark.
  # Upstreams resolus au demarrage via /etc/resolv.conf du container.
  # Recreer les containers api/web -> redemarrer proxy.

  log_format proxy '$remote_addr - $remote_user [$time_local] '
                   '"$request" $status $body_bytes_sent rt=$request_time '
                   'urt=$upstream_response_time xff="$http_x_forwarded_for"';
  access_log /var/log/nginx/access.log proxy;
  error_log  /var/log/nginx/error.log warn;

  upstream api_upstream { server api:8000; keepalive 32; }
  upstream web_upstream { server web:3000; keepalive 32; }

  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host  $host;
  proxy_set_header X-Request-Id      $request_id;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  client_max_body_size 25m;

  # ── HTTP -> HTTPS redirect ──────────────────────────────────────────────────
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  # ── HTTPS server ────────────────────────────────────────────────────────────
  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                              always;
    add_header X-Frame-Options           "SAMEORIGIN"                           always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"      always;

    # Healthcheck du proxy lui-meme (passe vers FastAPI)
    location = /health { proxy_pass http://api_upstream/health; }

    # SSE — pas de buffering, timeout long
    location ~ ^/analyze/.*/stream$ {
      proxy_pass http://api_upstream;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
      chunked_transfer_encoding on;
      gzip off;
    }

    # Backend API
    location ~ ^/(api/v1|auth|users|roles|permissions|analyze|search|analyses)(/|$) {
      proxy_pass http://api_upstream;
      proxy_read_timeout 60s;
    }

    # Tout le reste -> Next.js (HMR ws inutile en prod, pas de location dedie)
    location / {
      proxy_pass http://web_upstream;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 60s;
    }
  }
}
