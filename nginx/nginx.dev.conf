worker_processes auto;
events { worker_connections 1024; }

http {
  # Pas de directive `resolver` : portable Docker (DNS embarque 127.0.0.11)
  # ET Podman/netavark (DNS sur la gateway du reseau, IP dynamique).
  # Les `upstream { server api:8000; }` sont resolus au demarrage de nginx
  # via /etc/resolv.conf du container. En cas de recreation des containers
  # api/web, il faut redemarrer le service proxy : `podman compose restart proxy`
  # (ou `docker compose restart proxy`).

  log_format proxy '$remote_addr - $remote_user [$time_local] '
                   '"$request" $status $body_bytes_sent rt=$request_time '
                   'urt=$upstream_response_time xff="$http_x_forwarded_for"';
  access_log /var/log/nginx/access.log proxy;
  error_log  /var/log/nginx/error.log warn;

  upstream api_upstream { server api:8000; keepalive 32; }
  upstream web_upstream { server web:3000; keepalive 32; }

  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host  $host;
  proxy_set_header X-Request-Id      $request_id;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  client_max_body_size 25m;

  server {
    listen 80;
    server_name _;

    # Healthcheck du proxy lui-meme (passe vers FastAPI)
    location = /health { proxy_pass http://api_upstream/health; }

    # SSE — pas de buffering, timeout long
    location ~ ^/analyze/.*/stream$ {
      proxy_pass http://api_upstream;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
      chunked_transfer_encoding on;
      gzip off;
    }

    # Backend API — prefixes existants
    location ~ ^/(api/v1|auth|users|roles|permissions|analyze|search|analyses)(/|$) {
      proxy_pass http://api_upstream;
      proxy_read_timeout 60s;
    }

    # HMR Next.js (websocket)
    location /_next/webpack-hmr {
      proxy_pass http://web_upstream;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 1h;
    }
    location /_next/turbopack-hmr {
      proxy_pass http://web_upstream;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 1h;
    }

    # Tout le reste -> Next.js
    location / {
      proxy_pass http://web_upstream;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 60s;
    }
  }
}
