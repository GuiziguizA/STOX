worker_processes auto;
events { worker_connections 1024; }

http {
  # Resolver Docker DNS embarque (127.0.0.11) : permet a nginx de re-resoudre
  # les noms api/web a chaque requete (10s TTL) au lieu de les figer au boot.
  # Necessaire pour Coolify qui recree les containers a chaque deploy.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server_tokens off;

  # IP client reelle : Traefik (Coolify) ajoute l'IP du client a X-Forwarded-For.
  # On ne croit l'en-tete que venant des reseaux Docker ; sans ca, $remote_addr
  # vaut l'IP de Traefik et le rate limit ci-dessous serait commun a tous.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # Rate limit par IP sur l'API (les pages et assets Next.js ne sont pas limites).
  # Le backend garde ses propres limites, plus strictes, sur login/inscription.
  limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
  limit_req_status 429;

  log_format proxy '$remote_addr - $remote_user [$time_local] '
                   '"$request" $status $body_bytes_sent rt=$request_time '
                   'urt=$upstream_response_time xff="$http_x_forwarded_for"';
  access_log /var/log/nginx/access.log proxy;
  error_log  /var/log/nginx/error.log warn;

  # Variables pour forcer la re-resolution DNS a chaque requete (sinon nginx
  # cache l'IP au demarrage). Voir `proxy_pass $api_upstream` plus bas.
  map $host $api_upstream { default "http://api:8000"; }
  map $host $web_upstream { default "http://web:3000"; }

  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host  $host;
  proxy_set_header X-Request-Id      $request_id;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  client_max_body_size 25m;

  # Sans effet en HTTP local (les navigateurs l'ignorent hors HTTPS) ; en prod,
  # Traefik le relaie sur la connexion TLS.
  add_header Strict-Transport-Security "max-age=31536000" always;

  server {
    listen 80;
    server_name _;

    # Healthcheck du proxy lui-meme (passe vers FastAPI)
    location = /health { proxy_pass $api_upstream/health; }

    # SSE — pas de buffering, timeout long
    location ~ ^/analyze/.*/stream$ {
      limit_req zone=api burst=10 nodelay;
      proxy_pass $api_upstream$request_uri;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
      chunked_transfer_encoding on;
      gzip off;
    }

    # Backend API — prefixes existants
    location ~ ^/(api/v1|auth|users|roles|permissions|analyze|search|analyses)(/|$) {
      limit_req zone=api burst=40 nodelay;
      proxy_pass $api_upstream$request_uri;
      proxy_read_timeout 60s;
    }

    # HMR Next.js (websocket)
    location /_next/webpack-hmr {
      proxy_pass $web_upstream$request_uri;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 1h;
    }
    location /_next/turbopack-hmr {
      proxy_pass $web_upstream$request_uri;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 1h;
    }

    # Tout le reste -> Next.js
    location / {
      proxy_pass $web_upstream$request_uri;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 60s;
    }
  }
}
